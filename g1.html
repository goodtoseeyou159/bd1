<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Kopila 🎂🎉</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

/* Slides */
.slide {
    position: absolute;
    width: 100vw;
    height: 100vh;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
}

.active {
    opacity: 1;
    z-index: 2;
}

/* Background */
.bg {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(25px) brightness(0.6);
    transform: scale(1.2);
}

/* CENTER FIX (important upgrade) */
.center {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: zoom 6s ease-in-out infinite;
    padding: 10px;
}

/* Responsive image */
.fg {
    width: min(90vw, 600px);
    height: auto;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(0,0,0,0.8);
}

/* Zoom animation */
@keyframes zoom {
    0% { transform: scale(1); }
    100% { transform: scale(1.05); }
}

/* Text (responsive) */
.text {
    position: absolute;
    bottom: 8%;
    width: 100%;
    text-align: center;
    color: white;
    font-size: clamp(16px, 4vw, 32px);
    text-shadow: 0 0 15px black;
    z-index: 3;
    padding: 0 15px;
}

/* Effects canvas */
#effects {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 1;
}

/* Start screen */
#startScreen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 9999;
    color: white;
    text-align: center;
    padding: 20px;
}

#startScreen h1 {
    font-size: clamp(18px, 5vw, 32px);
    margin-bottom: 15px;
}

#startBtn {
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: pink;
}

/* Prevent mobile scroll bounce */
html, body {
    height: 100%;
}
</style>
</head>

<body>

<!-- START SCREEN -->
<div id="startScreen">
    <h1>💖 Tap Anywhere to Start 💖</h1>
    <button id="startBtn">Start Surprise 🎉</button>
</div>

<!-- EFFECTS -->
<canvas id="effects"></canvas>

<!-- SLIDES -->
<div class="slide active">
    <img class="bg" src="images/f0.jpg">
    <div class="center"><img class="fg" src="images/f0.jpg"></div>
    <div class="text">Happy Birthday 🎂🎊🎉<br>💖Dear Kopila💕</div>
</div>

<div class="slide">
    <img class="bg" src="images/f1.jpg">
    <div class="center"><img class="fg" src="images/f1.jpg"></div>
    <div class="text">Every moment with you is magical ✨</div>
</div>

<div class="slide">
    <img class="bg" src="images/f2.jpg">
    <div class="center"><img class="fg" src="images/f2.jpg"></div>
    <div class="text">You are my favorite person ❤️</div>
</div>

<div class="slide">
    <img class="bg" src="images/f3.jpg">
    <div class="center"><img class="fg" src="images/f3.jpg"></div>
    <div class="text">Stay happy always 💕</div>
</div>

<!-- MUSIC -->
<audio id="music" loop>
    <source src="audio/happybirthday.mp3" type="audio/mp3">
</audio>

<script>
/* SLIDES */
let slides = document.querySelectorAll('.slide');
let index = 0;

setInterval(() => {
    slides[index].classList.remove('active');
    index = (index + 1) % slides.length;
    slides[index].classList.add('active');
}, 4000);

/* START */
const music = document.getElementById("music");
const startScreen = document.getElementById("startScreen");

function start() {
    music.play().catch(() => {});
    startScreen.style.display = "none";
}

document.getElementById("startBtn").addEventListener("click", start);
startScreen.addEventListener("click", start);

/* EFFECTS */
const canvas = document.getElementById("effects");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

let hearts = [];
let sparks = [];

function createHeart() {
    hearts.push({
        x: Math.random() * canvas.width,
        y: canvas.height + 20,
        size: 8 + Math.random() * 15,
        speed: 1 + Math.random() * 2,
        alpha: 1
    });
}

function createSpark() {
    sparks.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        alpha: Math.random()
    });
}

function drawHeart(x, y, size, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "pink";

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.bezierCurveTo(x - size, y - size,
                      x - size * 2, y + size / 3,
                      x, y + size);

    ctx.bezierCurveTo(x + size * 2, y + size / 3,
                      x + size, y - size,
                      x, y);

    ctx.fill();
    ctx.restore();
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    hearts.forEach((h, i) => {
        h.y -= h.speed;
        h.alpha -= 0.005;
        drawHeart(h.x, h.y, h.size, h.alpha);
        if (h.alpha <= 0) hearts.splice(i, 1);
    });

    sparks.forEach((s) => {
        ctx.save();
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    });

    requestAnimationFrame(animate);
}

setInterval(createHeart, 250);
setInterval(createSpark, 80);
for (let i = 0; i < 60; i++) createSpark();

animate();

const pass = prompt("Enter our secret password ❤️");

if(pass !== "happybirthdaykops"){
document.body.innerHTML = `
<style>
body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:black;
color:white;
font-family:sans-serif;
}
</style>
<h1>Access Denied 💔</h1>
`;
}

</script>

</body>
</html>
